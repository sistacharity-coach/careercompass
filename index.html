async function callAI(messages) {
  const response = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 1000, messages }),
  });
  const data = await response.json();
  return data.content?.map(b => b.text || '').join('') || 'No response received.';
}

const SCENARIOS = [
  {
    id: 2, icon: '📄', title: 'Resume help',
    question: 'Do you need help completing your resume?',
    color: blue, cbg: blueL,
    prompt: j => `You are a professional resume coach using best practices from Zety, ResumeGenius, NovoResume, FlowCV, Resume.com and MakeMyCv.\nFor the position: "${j}".\nWrite a complete, ATS-optimized resume outline including:\n1. Professional summary (3-4 sentences)\n2. Key skills section (10-12 bullet points)\n3. Work experience section (3 roles, 4-5 strong action-verb bullets each)\n4. Education section template\n5. Optional sections relevant to this role\nUse O*NET occupational data for role-specific terminology and quantifiable language.`

      <div style={{ background: blueL, padding: '1.25rem 1.5rem', display: 'flex', justifyContent: 'center', gap: '3rem', flexWrap: 'wrap', borderBottom: `1px solid ${bd}` }}>
        {[['6', 'Career Tools'], ['7', 'Expert Sources'], ['100%', 'Free to Use'], ['0', 'Signups Needed']].map(([n, l]) => (

function ToolPage() {
  const [job, setJob] = useState('');
  const [sub, setSub] = useState('');
  const [active, setActive] = useState(null);
  const [resp, setResp] = useState({});
  const [load, setLoad] = useState({});
  const [inp, setInp] = useState('');
  const [fuLoad, setFuLoad] = useState(false);
  const [fuResp, setFuResp] = useState('');
  const [cp, setCp] = useState('');

  const submit = () => {
    if (job.trim()) { setSub(job.trim()); setActive(null); setResp({}); setFuResp(''); setInp(''); }
  };

  const fetchResp = async (id, prompt) => {
    setLoad(p => ({ ...p, [id]: true }));
    try {
      const text = await callAI([{ role: 'user', content: prompt }]);
      setResp(p => ({ ...p, [id]: text }));
    } catch {
      setResp(p => ({ ...p, [id]: 'Error getting response. Please try again.' }));
    }
    setLoad(p => ({ ...p, [id]: false }));
  };

  const clickScenario = s => {
    setActive(s); setFuResp(''); setInp('');
    if (!resp[s.id]) fetchResp(s.id, s.prompt(sub));
  };

  const followUp = async () => {
    if (!inp.trim() || !active) return;
    setFuLoad(true); setFuResp('');
    try {
      const text = await callAI([{ role: 'user', content: `Context for "${sub}" position:\n${resp[active.id]}\n\nFollow-up question: "${inp}"\nProvide a specific, actionable answer.` }]);
      setFuResp(text);
    } catch { setFuResp('Error. Please try again.'); }
    setFuLoad(false);
  };

  const copy = (t, k) => { navigator.clipboard.writeText(t); setCp(k); setTimeout(() => setCp(''), 1500); };
  const dl = (t, f) => { const b = new Blob([t], { type: 'text/plain' }), u = URL.createObjectURL(b), a = document.createElement('a'); a.href = u; a.download = f; a.click(); URL.revokeObjectURL(u); };

  const fmt = text => text.split('\n').map((line, i) => {
    if (!line.trim()) return <div key={i} style={{ height: 5 }} />;
    if (/^\d+\./.test(line.trim())) return (
      <div key={i} style={{ display: 'flex', gap: 8, marginBottom: 5 }}>
        <span style={{ color: mu, minWidth: 18, fontSize: 13 }}>{line.match(/^\d+/)[0]}.</span>
        <span style={{ fontSize: 13, lineHeight: 1.7, color: tx }}>{line.replace(/^\d+\.\s*/, '').replace(/\*\*/g, '')}</span>
      </div>
    );
    if (/^[-•]\s/.test(line.trim())) return (
      <div key={i} style={{ display: 'flex', gap: 8, marginBottom: 4 }}>
        <span style={{ color: mu, fontSize: 13 }}>•</span>
        <span style={{ fontSize: 13, lineHeight: 1.7, color: tx }}>{line.replace(/^[-•]\s*/, '').replace(/\*\*/g, '')}</span>
      </div>
    );
    if (line.trim().endsWith(':') && line.length < 65) return <p key={i} style={{ fontWeight: 700, fontSize: 13, color: navy, margin: '12px 0 4px' }}>{line}</p>;
    return <p key={i} style={{ fontSize: 13, lineHeight: 1.7, color: tx, marginBottom: 4 }}>{line.replace(/\*\*/g, '')}</p>;
  });

  const btn = c => ({ fontSize: 12, padding: '4px 10px', background: c || 'transparent', color: c ? wh : tx, border: c ? 'none' : `1px solid ${bd}`, borderRadius: 6, fontWeight: c ? 600 : 400 });

  return (
    <main style={{ padding: '2rem 1.5rem', maxWidth: 820, margin: '0 auto' }}>
      <h1 style={{ fontSize: 24, fontWeight: 800, color: navy, marginBottom: 5 }}>Job Seeker Tool</h1>
      <p style={{ fontSize: 14, color: mu, marginBottom: '1.5rem' }}>Enter your target job title once — all 6 tools below will personalize to it automatically.</p>
      <div style={{ background: wh, border: `1px solid ${bd}`, borderRadius: 12, padding: '1rem 1.25rem', marginBottom: '1.25rem' }}>
        <p style={{ fontSize: 11, fontWeight: 700, color: mu, textTransform: 'uppercase', letterSpacing: '0.07em', marginBottom: 8 }}>
          Step 1 · What position are you applying for?
        </p>
        <div style={{ display: 'flex', gap: 8 }}>
          <input type="text" value={job} onChange={e => setJob(e.target.value)} onKeyDown={e => e.key === 'Enter' && submit()}
            placeholder="e.g. Software Engineer, Registered Nurse, Marketing Manager..."
            style={{ flex: 1, padding: '9px 12px', border: `1px solid ${bd}`, borderRadius: 8, fontSize: 14 }} />
          <button onClick={submit} style={{ ...btn(blue), padding: '0 18px', fontSize: 14 }}>Get started</button>
        </div>
        {sub && (
          <div style={{ marginTop: 8, display: 'flex', alignItems: 'center', gap: 6 }}>
            <span style={{ fontSize: 12, background: blueL, color: blue, padding: '3px 11px', borderRadius: 20, fontWeight: 600 }}>✓ {sub}</span>
            <span style={{ fontSize: 12, color: mu }}>carried across all tools</span>
          </div>
        )}
      </div>
      <p style={{ fontSize: 11, fontWeight: 700, color: mu, textTransform: 'uppercase', letterSpacing: '0.07em', marginBottom: 10 }}>Step 2 · Choose a tool</p>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: 10, marginBottom: '1.25rem' }}>
        {SCENARIOS.map(s => {
          const isAct = active?.id === s.id, done = !!resp[s.id];
          return (
            <div key={s.id} onClick={() => sub && clickScenario(s)}
              style={{ background: wh, border: isAct ? `2px solid ${s.color}` : `1px solid ${bd}`, borderRadius: 12, padding: '0.9rem 1rem', cursor: sub ? 'pointer' : 'not-allowed', opacity: sub ? 1 : 0.38, position: 'relative', transition: 'border-color 0.15s' }}>
              {done && <span style={{ position: 'absolute', top: 8, right: 8, fontSize: 10, background: tealL, color: teal, padding: '2px 7px', borderRadius: 20, fontWeight: 700 }}>✓ Done</span>}
              {load[s.id] && <span style={{ position: 'absolute', top: 8, right: 8, fontSize: 10, background: blueL, color: blue, padding: '2px 7px', borderRadius: 20, fontWeight: 700 }}>Loading…</span>}
              <div style={{ fontSize: 20, marginBottom: 7 }}>{s.icon}</div>
              <p style={{ fontSize: 13, fontWeight: 700, color: navy, marginBottom: 3 }}>{s.title}</p>
              <p style={{ fontSize: 12, color: mu, lineHeight: 1.5 }}>{s.question}</p>
            </div>
          );
        })}
      </div>
      {active && (
        <div style={{ background: wh, border: `1px solid ${bd}`, borderRadius: 12, padding: '1.25rem', animation: 'fadeIn 0.2s ease' }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 12, flexWrap: 'wrap', gap: 8 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              <span style={{ fontSize: 18 }}>{active.icon}</span>
              <span style={{ fontSize: 14, fontWeight: 700, color: navy }}>{active.title}</span>
              <span style={{ fontSize: 12, background: active.cbg, color: active.color, padding: '2px 10px', borderRadius: 20, fontWeight: 600 }}>{sub}</span>
            </div>
            {resp[active.id] && (
              <div style={{ display: 'flex', gap: 6 }}>
                <button style={btn()} onClick={() => copy(resp[active.id], 'main')}>{cp === 'main' ? 'Copied!' : 'Copy'}</button>
                <button style={btn()} onClick={() => dl(resp[active.id], `${sub.replace(/\s+/g, '_')}_${active.title.replace(/\s+/g, '_')}.txt`)}>Download</button>
              </div>
            )}
          </div>
          {load[active.id]
            ? <div style={{ padding: '2rem', textAlign: 'center' }}>
                <p style={{ fontSize: 13, color: mu, marginBottom: 12 }}>Generating your personalized {active.title.toLowerCase()}…</p>
                <div style={{ width: 28, height: 28, border: `2.5px solid ${active.cbg}`, borderTopColor: active.color, borderRadius: '50%', animation: 'spin 0.8s linear infinite', margin: '0 auto' }} />
              </div>
            : resp[active.id] && (
                <div style={{ background: bg, borderRadius: 8, padding: '1rem', maxHeight: 380, overflowY: 'auto' }}>
                  {fmt(resp[active.id])}
                </div>
              )
          }
          {resp[active.id] && (
            <div style={{ marginTop: '1rem', borderTop: `1px solid ${bd}`, paddingTop: '1rem' }}>
              <p style={{ fontSize: 11, fontWeight: 700, color: mu, textTransform: 'uppercase', letterSpacing: '0.07em', marginBottom: 8 }}>Follow-up question</p>
              <div style={{ display: 'flex', gap: 8 }}>
                <input type="text" value={inp} onChange={e => setInp(e.target.value)} onKeyDown={e => e.key === 'Enter' && followUp()}
                  placeholder={`Ask anything about ${active.title.toLowerCase()} for ${sub}…`}
                  style={{ flex: 1, padding: '8px 12px', border: `1px solid ${bd}`, borderRadius: 8, fontSize: 13 }} />
                <button onClick={followUp} style={{ ...btn(active.color), padding: '0 14px', whiteSpace: 'nowrap' }}>Ask ↗</button>
              </div>
              {fuLoad && <p style={{ fontSize: 13, color: mu, marginTop: 8 }}>Thinking…</p>}
              {fuResp && (
                <div style={{ marginTop: 12 }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 6 }}>
                    <span style={{ fontSize: 11, fontWeight: 700, color: mu, textTransform: 'uppercase', letterSpacing: '0.07em' }}>Response</span>
                    <div style={{ display: 'flex', gap: 5 }}>
                      <button style={{ ...btn(), fontSize: 11, padding: '3px 8px' }} onClick={() => copy(fuResp, 'fu')}>{cp === 'fu' ? 'Copied!' : 'Copy'}</button>
                      <button style={{ ...btn(), fontSize: 11, padding: '3px 8px' }} onClick={() => dl(fuResp, `${sub.replace(/\s+/g, '_')}_followup.txt`)}>Download</button>
                    </div>
                  </div>
                  <div style={{ background: bg, borderRadius: 8, padding: '1rem', maxHeight: 260, overflowY: 'auto' }}>
                    {fmt(fuResp)}
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      )}
    </main>
  );
}

function ResourcesPage() {
  const res = [
    { n: 'O*NET OnLine', u: 'https://www.onetonline.org', d: 'Official US occupational database with detailed job profiles, skills, tasks, and salary data for 1,000+ careers.', t: 'Occupational Data', c: blue },
    { n: 'Zety', u: 'https://zety.com', d: 'Top-rated resume builder with expert career advice, cover letter templates, and step-by-step guidance.', t: 'Resume Builder', c: '#533AB7' },
    { n: 'ResumeGenius', u: 'https://resumegenius.com', d: 'Fast resume builder with industry-specific templates and expert writing tips for all experience levels.', t: 'Resume Builder', c: teal },
    { n: 'NovoResume', u: 'https://novoresume.com', d: 'Modern ATS-friendly resume and cover letter templates with real-time content suggestions.', t: 'Resume Builder', c: '#993C1D' },
    { n: 'FlowCV', u: 'https://flowcv.com', d: 'Free professional resume builder with clean, modern designs optimized for applicant tracking systems.', t: 'Resume Builder', c: '#3B6D11' },
    { n: 'Resume.com', u: 'https://resume.com', d: 'Completely free resume builder with dozens of templates and a built-in job board to find opportunities.', t: 'Resume + Jobs', c: '#72243E' },
    { n: 'MakeMyCv', u: 'https://makemycv.com', d: 'Simple, guided CV and resume builder with practical tips for making your application stand out.', t: 'CV Builder', c: '#854F0B' },
  ];
  const tips = [
    'Tailor your resume to each job description — match keywords from the posting.',
    'Use strong action verbs: led, built, launched, increased, reduced, managed.',
    'Quantify achievements whenever possible (e.g. "increased sales by 30%").',
    'Keep your resume to 1 page (2 pages max for 10+ years of experience).',
    'Always write a cover letter, even when listed as optional.',
    'Follow up on applications after 5–7 business days with a brief, professional email.',
  ];
  return (
    <main>
      <PageHeader title="Resources" sub="7 trusted platforms that power CareerCompass — visit them for deeper tools, templates, and career content." />
      <div style={{ maxWidth: 820, margin: '0 auto', padding: '2.5rem 1.5rem' }}>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(220px, 1fr))', gap: 12, marginBottom: '2.5rem' }}>
          {res.map(r => (
            <div key={r.n} style={{ background: wh, border: `1px solid ${bd}`, borderRadius: 12, padding: '1rem', display: 'flex', flexDirection: 'column', gap: 8 }}>
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                <span style={{ fontWeight: 700, fontSize: 13, color: navy }}>{r.n}</span>
                <span style={{ fontSize: 10, background: '#F3F4F6', color: mu, padding: '2px 8px', borderRadius: 20, fontWeight: 600 }}>{r.t}</span>
              </div>
              <p style={{ fontSize: 12, color: mu, lineHeight: 1.65, flex: 1 }}>{r.d}</p>
              <a href={r.u} target="_blank" rel="noreferrer" style={{ fontSize: 12, color: r.c, fontWeight: 600 }}>Visit {r.n} →</a>
            </div>
          ))}
        </div>
        <div style={{ background: blueL, borderRadius: 12, padding: '1.5rem', border: `1px solid ${bd}` }}>
          <h2 style={{ fontSize: 18, fontWeight: 700, color: navy, marginBottom: 14 }}>Quick career tips</h2>
          {tips.map((t, i) => (
            <div key={i} style={{ display: 'flex', gap: 10, marginBottom: 10, alignItems: 'flex-start' }}>
              <span style={{ width: 22, height: 22, borderRadius: '50%', background: blue, color: wh, fontSize: 11, fontWeight: 700, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, marginTop: 1 }}>{i + 1}</span>
              <p style={{ fontSize: 13, color: tx, lineHeight: 1.65 }}>{t}</p>
            </div>
          ))}
        </div>
      </div>
    </main>
  );
}

function ContactPage() {
  const [form, setForm] = useState({ name: '', email: '', subject: '', message: '' });
  const [sent, setSent] = useState(false);
  const set = (k, v) => setForm(p => ({ ...p, [k]: v }));
  const inp = { width: '100%', padding: '9px 12px', border: `1px solid ${bd}`, borderRadius: 8, fontSize: 13, outline: 'none', color: tx, background: wh, marginBottom: 12 };
  return (
    <main>
      <PageHeader title="Contact" sub="Questions, feedback, or partnership inquiries — we'd love to hear from you." />
      <div style={{ maxWidth: 520, margin: '0 auto', padding: '3rem 1.5rem' }}>
        {sent
          ? <div style={{ textAlign: 'center', padding: '3rem', background: tealL, borderRadius: 12, border: `1px solid ${bd}` }}>
              <div style={{ fontSize: 40, marginBottom: 14 }}>✓</div>
              <h2 style={{ fontSize: 22, fontWeight: 700, color: teal, marginBottom: 8 }}>Message sent!</h2>
              <p style={{ fontSize: 14, color: mu, lineHeight: 1.6 }}>Thank you for reaching out. We'll get back to you within 2 business days.</p>
            </div>
          : <div style={{ background: wh, border: `1px solid ${bd}`, borderRadius: 12, padding: '1.5rem' }}>
              <div style={{ display: 'flex', gap: 12 }}>
                <div style={{ flex: 1 }}>
                  <label style={{ fontSize: 11, fontWeight: 700, color: mu, textTransform: 'uppercase', letterSpacing: '0.07em', display: 'block', marginBottom: 5 }}>Name</label>
                  <input style={inp} value={form.name} onChange={e => set('name', e.target.value)} placeholder="Your full name" />
                </div>
                <div style={{ flex: 1 }}>
                  <label style={{ fontSize: 11, fontWeight: 700, color: mu, textTransform: 'uppercase', letterSpacing: '0.07em', display: 'block', marginBottom: 5 }}>Email</label>
                  <input style={inp} type="email" value={form.email} onChange={e => set('email', e.target.value)} placeholder="you@email.com" />
                </div>
              </div>
              <label style={{ fontSize: 11, fontWeight: 700, color: mu, textTransform: 'uppercase', letterSpacing: '0.07em', display: 'block', marginBottom: 5 }}>Subject</label>
              <input style={inp} value={form.subject} onChange={e => set('subject', e.target.value)} placeholder="What's this about?" />
              <label style={{ fontSize: 11, fontWeight: 700, color: mu, textTransform: 'uppercase', letterSpacing: '0.07em', display: 'block', marginBottom: 5 }}>Message</label>
              <textarea style={{ ...inp, minHeight: 120, resize: 'vertical', fontFamily: 'inherit', marginBottom: 16 }} value={form.message} onChange={e => set('message', e.target.value)} placeholder="Your message…" />
              <button onClick={() => { if (form.name && form.email && form.message) setSent(true); }}
                style={{ background: navy, color: wh, border: 'none', padding: '12px 24px', borderRadius: 8, fontSize: 14, fontWeight: 700, width: '100%' }}>
                Send message →
              </button>
              <p style={{ fontSize: 12, color: mu, textAlign: 'center', marginTop: 10 }}>
                To receive real messages, connect this form to <a href="https://formspree.io" target="_blank" rel="noreferrer" style={{ color: blue }}>Formspree</a> or <a href="https://www.emailjs.com" target="_blank" rel="noreferrer" style={{ color: blue }}>EmailJS</a>.
              </p>
            </div>
        }
      </div>
    </main>
  );
}

function App() {
  const [page, setPage] = useState('home');
  const goTo = p => { setPage(p); window.scrollTo(0, 0); };
  return (
    <div style={{ fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif', background: bg, color: tx, minHeight: '100vh' }}>
      <Nav page={page} setPage={goTo} />
      {page === 'home'      && <HomePage setPage={goTo} />}
      {page === 'about'     && <AboutPage />}
      {page === 'tool'      && <ToolPage />}
      {page === 'resources' && <ResourcesPage />}
      {page === 'contact'   && <ContactPage />}
      <Footer setPage={goTo} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
